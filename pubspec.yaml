name: bereshit_solar_mobile
description: "גרסה ניידת ל-CRM של בראשית סולאר, עובדת מול אותו גיליון Google Sheets דרך ה-API החדש ב-code.js"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  webview_flutter: ^4.7.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  
flutter:
  uses-material-design: true
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # הגדרות לאייקון מודרני באנדרואיד (רקע כחול של בראשית סולאר ולוגו מעליו):
  adaptive_icon_background: "#1A3A5F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true