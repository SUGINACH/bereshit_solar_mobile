name: Build Windows Desktop App

on:
  workflow_dispatch: # מופעל ידנית בלחיצת כפתור

jobs:
  build:
    runs-on: windows-latest # שרת ווינדוס של גיטהאב

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Archive Windows Release
        shell: pwsh
        run: |
          $path = if (Test-Path "build\windows\x64\runner\Release") { "build\windows\x64\runner\Release\*" } else { "build\windows\runner\Release\*" }
          Compress-Archive -Path $path -DestinationPath "bereshit-solar-windows.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bereshit-solar-windows
          path: bereshit-solar-windows.zip
